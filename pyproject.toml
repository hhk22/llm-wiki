[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-wiki"
version = "0.1.0"
description = "A reproducible RAG baseline for the LLM Wiki portfolio project"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.118,<1.0",
  "google-genai>=1.0,<2.0",
  "httpx>=0.28,<1.0",
  "mcp>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "python-dotenv>=1.0,<2.0",
  "pyyaml>=6.0,<7.0",
  "uvicorn>=0.37,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.11,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
